site_name: MMVII Documentation
site_description: Documentation for MicMac V2 (MMVII) — open-source photogrammetry
site_url: https://erupnik.github.io/MMVII/
repo_name: micmac-V2/MMVII
repo_url: https://github.com/micmac-V2/MMVII

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css: []

nav:
  - Home: index.md
  - User Guide:
    - Installation: user-guide/installation.md
    - Command Reference: user-guide/commands.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Orientation & Relative Poses: tutorials/orientation.md
    - Bundle Adjustment: tutorials/bundle-adjustment.md
    - Topometry & Clinometers: tutorials/topometry.md
    - Use Cases:
      - Image Development: tutorials/use-cases/image-development.md
      - Coded Targets: tutorials/use-cases/coded-targets.md
  - Theory:
    - Overview: theory/index.md
    - Camera Modelization: theory/camera-modelization.md
  - Developer Guide:
    - Overview: developer/index.md
    - Adding Commands: developer/programming-guide.md
    - Serialization: developer/serialization.md
    - Non-Linear Optimisation: developer/nonlinear-optim.md
    - Symbolic Derivation: developer/symbolic-derivation.md
    - Image Classes: developer/image-classes.md
    - Mapping Framework: developer/mapping.md
    - Interpolators: developer/interpolators.md
    - Graph Library: developer/graph.md
    - Python API: developer/python-api.md
  - API Reference: api/index.md
